<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003380" />
    <meta name="description" content="Unified Online Verification & Digital Certification System for Legal Metrology" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>e-Metrology | Verification & Digital Certification Portal</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('PWA Service Worker registered:', reg.scope);
          }).catch(err => {
            console.log('PWA Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
